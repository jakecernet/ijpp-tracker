name: Build APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3

      - run: npm i -g @bubblewrap/cli

      - name: Bubblewrap config
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Restore keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android.keystore

      - name: Bump version
        run: |
          jq '.appVersionCode = ${{ github.run_number }} | .appVersion = "${{ github.run_number }}"' \
            twa-manifest.json > tmp.json && mv tmp.json twa-manifest.json

      - name: Build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bubblewrap update --skipVersionUpgrade
          bubblewrap build --skipPwaValidation

      - uses: actions/upload-artifact@v4
        with:
          name: ijpp-tracker-apk
          path: |
            android/app-release-signed.apk
            android/app-release-bundle.aab

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app-release-signed.apk